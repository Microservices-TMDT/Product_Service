eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8083

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:mysql://localhost:3306/product_service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: product-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "com.example.order_service.dto.response.OrderResponse:com.example.product_service.kafka.event.OrderCreatedEvent,com.example.order_service.kafka.events.OrderCreatedEvent:com.example.product_service.kafka.event.OrderCreatedEvent"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ---------------------------------------------------------------- Redis (L2 cache)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # ---------------------------------------------------------------- Cache
  cache:
    type: caffeine   # default CacheManager = Caffeine (L1)
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5s

# ---------------------------------------------------------------- Redisson (distributed lock)
spring.redisson:
  config: |
    singleServerConfig:
      address: "redis://localhost:6379"
      connectionMinimumIdleSize: 2
      connectionPoolSize: 10
